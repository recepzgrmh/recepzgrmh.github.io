<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Sürüm bilgisi nerede taşınır</title><desc id="d">Sürümün URL, header ve tarih parametresiyle taşınmasının karşılaştırılması.</desc><rect width="1200" height="675" fill="#fafaf7"/><circle cx="1100" cy="64" r="150" fill="#e9d5ff"/><circle cx="1160" cy="715" r="150" fill="#ff9f1c"/><g transform="translate(0,78)"><text x="90" y="88" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">SÜRÜMÜ NEREDE TAŞIYORSUN</text><rect x="90" y="150" width="1020" height="84" rx="24" fill="#111114"/><text x="124" y="180" fill="#98a2b3" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="20">URL yolu</text><text x="124" y="215" fill="#e7ff3c" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700">/v2/payments</text><text x="1080" y="205" fill="#98a2b3" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end">görünür, cache dostu, taşınması zor</text><rect x="90" y="250" width="1020" height="84" rx="24" fill="#ffffff" stroke="#111114" stroke-width="3"/><text x="124" y="280" fill="#98a2b3" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="20">Header</text><text x="124" y="315" fill="#111114" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700">API-Version: 2</text><text x="1080" y="305" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end">URL sabit kalır, gözden kaçar</text><rect x="90" y="350" width="1020" height="84" rx="24" fill="#ffffff" stroke="#111114" stroke-width="3"/><text x="124" y="380" fill="#98a2b3" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="20">Tarih</text><text x="124" y="415" fill="#111114" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700">Stripe-Version: 2026-08-01</text><text x="1080" y="405" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end">istemci dondurulur, geçiş kademeli</text><text x="90" y="470" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">ÜÇÜ DE SÜRÜM TAŞIR, ÜÇÜNÜN GEÇIŞ MALIYETI FARKLIDIR</text></g></svg>