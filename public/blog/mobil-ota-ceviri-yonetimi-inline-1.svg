<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">OTA çeviri paketi akışı</title><desc id="d">Çeviri paketinin indirme, doğrulama ve etkinleştirme süreci.</desc><rect width="1200" height="675" fill="#fafaf7"/><circle cx="1100" cy="64" r="150" fill="#e9d5ff"/><circle cx="1160" cy="715" r="150" fill="#ff9f1c"/><g transform="translate(0,78)"><text x="90" y="88" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">İNDİR, DOĞRULA, SONRA ETKİNLEŞTİR</text><rect x="90" y="150" width="238" height="210" rx="28" fill="#111114"/><text x="120" y="205" fill="#ff9f1c" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="19" font-weight="700">01</text><text x="120" y="248" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">İndir</text><text x="120" y="312" fill="#98a2b3" font-family="Arial,Helvetica,sans-serif" font-size="17">Paket sürümüyle</text><text x="120" y="333" fill="#98a2b3" font-family="Arial,Helvetica,sans-serif" font-size="17">birlikte çekilir.</text><rect x="348" y="150" width="238" height="210" rx="28" fill="#ffffff" stroke="#111114" stroke-width="3"/><text x="378" y="205" fill="#98a2b3" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="19" font-weight="700">02</text><text x="378" y="248" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Doğrula</text><text x="378" y="312" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="17">İmza ve bütünlük</text><text x="378" y="333" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="17">kontrolü.</text><rect x="606" y="150" width="238" height="210" rx="28" fill="#ffffff" stroke="#111114" stroke-width="3"/><text x="636" y="205" fill="#98a2b3" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="19" font-weight="700">03</text><text x="636" y="248" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Etkinleştir</text><text x="636" y="312" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="17">Yeni paket bir</text><text x="636" y="333" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="17">sonraki açılışta.</text><rect x="864" y="150" width="238" height="210" rx="28" fill="#e7ff3c" stroke="#111114" stroke-width="3"/><text x="894" y="205" fill="#98a2b3" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="19" font-weight="700">04</text><text x="894" y="248" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Fallback</text><text x="894" y="312" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="17">Hata varsa gömülü</text><text x="894" y="333" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="17">metin.</text><text x="90" y="470" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">DOĞRULANMAMIŞ PAKET ASLA ETKIN SÜRÜM OLMAZ</text></g></svg>