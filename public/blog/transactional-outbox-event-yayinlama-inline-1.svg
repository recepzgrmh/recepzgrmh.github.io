<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Tek transaction, iki kayıt</title><desc id="d">İş verisi ve outbox kaydının birlikte yazılıp relay ile broker&#x27;a aktarılması.</desc><rect width="1200" height="675" fill="#fafaf7"/><circle cx="1100" cy="64" r="150" fill="#e9d5ff"/><circle cx="1160" cy="715" r="150" fill="#ff9f1c"/><g transform="translate(0,78)"><text x="90" y="88" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">İŞ VERİSİ VE OLAY AYNI TRANSACTION&#x27;DA</text><rect x="90" y="150" width="330" height="250" rx="28" fill="#111114"/><text x="126" y="205" fill="#ff9f1c" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="19" font-weight="700">BEGIN</text><text x="126" y="262" fill="#ffffff" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700">orders INSERT</text><text x="126" y="312" fill="#e7ff3c" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="22" font-weight="700">outbox INSERT</text><text x="126" y="364" fill="#ff9f1c" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="19" font-weight="700">COMMIT</text><path d="M440 275H526" stroke="#ff3b4a" stroke-width="8" stroke-linecap="round"/><path d="m520 253 26 22-26 22" fill="none" stroke="#ff3b4a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="570" y="150" width="250" height="250" rx="28" fill="#ffffff" stroke="#111114" stroke-width="3"/><text x="600" y="220" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">relay outbox&#x27;ı</text><text x="600" y="248" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">sırayla okur</text><text x="600" y="320" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="17">gönderilen kayıt</text><text x="600" y="341" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="17">işaretlenir</text>