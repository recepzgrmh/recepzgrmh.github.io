name: Deploy content studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/deploy-content-studio.yml"

jobs:
  deploy:
    if: ${{ vars.STUDIO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: studio
          command: deploy
