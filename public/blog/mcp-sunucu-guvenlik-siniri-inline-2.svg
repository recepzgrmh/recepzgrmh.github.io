<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">MCP isteğinde kontroller</title><desc id="d">Kimlik, token audience, kapsam ve kaynak sahipliği kontrolleri.</desc><rect width="1200" height="675" fill="#fafaf7"/><circle cx="1100" cy="64" r="150" fill="#e9d5ff"/><circle cx="1160" cy="715" r="150" fill="#ff9f1c"/><g transform="translate(0,78)"><text x="90" y="88" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">HER ÇAĞRIDA DÖRT KONTROL</text><rect x="90" y="150" width="238" height="210" rx="28" fill="#111114"/><text x="120" y="208" fill="#ff9f1c" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="700">kimlik</text><text x="120" y="252" fill="#98a2b3" font-family="Arial,Helvetica,sans-serif" font-size="18">İsteği hangi</text><text x="120" y="275" fill="#98a2b3" font-family="Arial,Helvetica,sans-serif" font-size="18">kullanıcı adına</text><text x="120" y="298" fill="#98a2b3" font-family="Arial,Helvetica,sans-serif" font-size="18">yapıyorsun?</text><rect x="348" y="150" width="238" height="210" rx="28" fill="#ffffff" stroke="#111114" stroke-width="3"/><text x="378" y="208" fill="#111114" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="700">audience</text><text x="378" y="252" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="18">Token bu sunucu</text><text x="378" y="275" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="18">için mi verildi?</text><rect x="606" y="150" width="238" height="210" rx="28" fill="#ffffff" stroke="#111114" stroke-width="3"/><text x="636" y="208" fill="#111114" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="700">kapsam</text><text x="636" y="252" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="18">İzin verilen işlem</text><text x="636" y="275" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="18">kümesi ne?</text><rect x="864" y="150" width="238" height="210" rx="28" fill="#e7ff3c" stroke="#111114" stroke-width="3"/><text x="894" y="208" fill="#111114" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="21" font-weight="700">sahiplik</text><text x="894" y="252" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="18">Kaynak gerçekten bu</text><text x="894" y="275" fill="#3c3c43" font-family="Arial,Helvetica,sans-serif" font-size="18">kullanıcının mı?</text><text x="90" y="470" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">DÖRDÜ DE SUNUCUDA KONTROL EDILIR, MODELE SORULMAZ</text></g></svg>