<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Bearer ile DPoP karşılaştırması</title><desc id="d">Bearer token ile DPoP bağlı token isteğinin karşılaştırması.</desc><rect width="1200" height="675" fill="#fafaf7"/><circle cx="1100" cy="64" r="150" fill="#e9d5ff"/><circle cx="1160" cy="715" r="150" fill="#ff9f1c"/><g transform="translate(0,78)"><text x="90" y="88" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">ÇALINAN TOKEN BAŞKA CİHAZDA NE YAPAR</text><rect x="90" y="150" width="470" height="250" rx="28" fill="#ffffff" stroke="#e6e8ec" stroke-width="3"/><text x="126" y="202" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Bearer</text><text x="126" y="252" fill="#3c3c43" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="18">Authorization: Bearer eyJ…</text><text x="126" y="306" fill="#ff3b4a" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">→ kabul edilir</text><text x="126" y="352" fill="#98a2b3" font-family="Arial,Helvetica,sans-serif" font-size="18">sunucu istemciyi ayırt edemez</text><rect x="640" y="150" width="470" height="250" rx="28" fill="#111114"/><text x="676" y="202" fill="#e7ff3c" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">DPoP</text><text x="676" y="252" fill="#98a2b3" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="18">DPoP: &lt;proof&gt;  +  cnf.jkt</text><text x="676" y="306" fill="#e7ff3c" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">→ reddedilir</text><text x="676" y="352" fill="#98a2b3" font-family="Arial,Helvetica,sans-serif" font-size="18">özel anahtar cihazda kaldı</text><text x="90" y="470" fill="#111114" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">FARK TOKEN&#x27;IN GIZLILIĞINDE DEĞIL, SAHIPLIĞIN KANITLANMASINDA</text></g></svg>